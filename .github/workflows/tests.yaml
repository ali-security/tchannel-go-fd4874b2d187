name: Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional go test -run regex; empty runs the full suite'
        required: false
        default: ''

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GOPATH: ${{ github.workspace }}
      GOBIN: ${{ github.workspace }}/bin
      TEST_TIMEOUT_SCALE: "3"
    defaults:
      run:
        working-directory: ${{ env.GOPATH }}/src/github.com/temporalio/tchannel-go
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go: ["1.17.x", "1.21.x"]
        include:
        - os: macos-latest
          go: 1.23.x

    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
        cache: false

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: ${{ env.GOPATH }}/src/github.com/temporalio/tchannel-go

    - name: Load cache
      uses: actions/cache@v4
      with:
        path: ~/.glide/cache
        key: ${{ runner.os }}-go-${{ hashFiles('**/glide.lock') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build thrift compiler (macOS)
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        THRIFT_VERSION=$(sed -n 's/^THRIFT_VERSION="\(.*\)"$/\1/p' scripts/install-thrift.sh)
        THRIFT_SHA256=$(sed -n 's/^THRIFT_SHA256="\(.*\)"$/\1/p' scripts/install-thrift.sh)
        WORK="$RUNNER_TEMP/thrift"
        mkdir -p "$WORK/src" "$WORK/build"
        curl -fsSL "https://archive.apache.org/dist/thrift/${THRIFT_VERSION}/thrift-${THRIFT_VERSION}.tar.gz" -o "$WORK/thrift.tar.gz"
        echo "${THRIFT_SHA256}  $WORK/thrift.tar.gz" | shasum -U -a 256 -c
        tar -xf "$WORK/thrift.tar.gz" --strip-components=1 -C "$WORK/src"
        brew install bison flex
        export CMAKE_POLICY_VERSION_MINIMUM=3.5
        THRIFT_SRC="$WORK/src" THRIFT_BUILD="$WORK/build" scripts/build-thrift.sh
        mkdir -p .bin
        cp "$WORK/build/bin/Release/thrift" .bin/thrift
        .bin/thrift --version

    - name: Install CI
      run: make install_ci

    - name: Test CI
      env:
        NO_TEST: ${{ matrix.NO_TEST }}
      run: |
        set -o pipefail
        TEST_LOG="$RUNNER_TEMP/test.log"
        if [ -n "${{ inputs.test-filter }}" ]; then
          make test_ci TEST_ARG="-race -v -timeout 5m -run ${{ inputs.test-filter }}" 2>&1 | tee "$TEST_LOG"
        else
          { test -n "$NO_TEST" || make test_ci; } 2>&1 | tee "$TEST_LOG"
        fi
        awk '/^--- PASS/{p++} /^--- FAIL/{f++} /^--- SKIP/{s++} END{printf "TEST SUMMARY: %d passed, %d failed, %d skipped\n", p, f, s}' "$TEST_LOG"

    - name: Crossdock CI
      run: make crossdock_logs_ci

  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.24.x
        cache: false

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: src

    - name: Build module zip
      run: |
        set -euo pipefail
        HELPER="$RUNNER_TEMP/zipper"
        mkdir -p "$HELPER" "$GITHUB_WORKSPACE/dist"
        cat > "$HELPER/main.go" <<'EOF'
        package main

        import (
            "os"

            "golang.org/x/mod/module"
            "golang.org/x/mod/zip"
        )

        func main() {
            out, err := os.Create(os.Args[3])
            if err != nil {
                panic(err)
            }
            defer out.Close()
            mv := module.Version{Path: os.Args[1], Version: os.Args[2]}
            if err := zip.CreateFromDir(out, mv, os.Args[4]); err != nil {
                panic(err)
            }
        }
        EOF
        cd "$HELPER"
        go mod init zipper
        go get golang.org/x/mod@v0.24.0
        go build -o zipper .
        VERSION=v1.22.1-0.20240528171429-1db37fdea938
        ./zipper github.com/temporalio/tchannel-go "$VERSION" "$GITHUB_WORKSPACE/dist/$VERSION.zip" "$GITHUB_WORKSPACE/src"
        COUNT=$(unzip -Z1 "$GITHUB_WORKSPACE/dist/$VERSION.zip" | wc -l)
        echo "module zip entries: $COUNT"
        test "$COUNT" -eq 352

    - name: Upload module zip
      uses: actions/upload-artifact@v4
      with:
        name: module-zip
        path: dist/*.zip
        if-no-files-found: error
